# Publishes the site with GitHub Actions instead of the built-in Pages builder.
#
# The built-in ("legacy") builder failed repeatedly on this repo with nothing
# but "Page build failed" and no log to act on, even with .nojekyll committed.
# This path uploads the files as an artifact and deploys them verbatim - no
# Jekyll, and a real build log when something does go wrong.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        # Also switches this repo from the legacy builder to Actions deployment.
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
